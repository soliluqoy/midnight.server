name: midnight.server Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      model:
        description: "Download the 2.5 GiB model and run real-inference tests"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Bootstrap (pinned Bun, npm ci --ignore-scripts)
        shell: pwsh
        run: .\scripts\bootstrap.ps1 -Install

      - name: Check
        run: npm run check

      - name: midnight unit tests (no model)
        working-directory: packages/coding-agent
        run: >-
          node ../../node_modules/vitest/dist/cli.js --run
          test/midnight-local-runtime.test.ts test/midnight-helper.test.ts test/midnight-download.test.ts
          test/midnight-model-integrity.test.ts test/midnight-config.test.ts test/suite/midnight-delegate.test.ts

      - name: Build and package (no model)
        shell: pwsh
        run: |
          .\scripts\build.ps1
          .\scripts\package.ps1
          .\scripts\verify-release.ps1 -Package dist\midnight.server-windows-x64.zip

      - name: Real-model tests
        if: ${{ inputs.model }}
        shell: pwsh
        env:
          MIDNIGHT_SERVER_ENGINE_TESTS: "1"
        run: |
          .\scripts\fetch-model.ps1
          New-Item -ItemType Directory -Force build\engine | Out-Null
          Copy-Item -Recurse build\dist\midnight.server-windows-x64-cpu\engine\cpu build\engine\cpu
          Push-Location packages\coding-agent
          node ..\..\node_modules\vitest\dist\cli.js --run test/midnight-engine.integration.test.ts
          Pop-Location
          .\scripts\package.ps1 -IncludeModel
          .\scripts\verify-release.ps1 -Package dist\midnight.server-windows-x64-offline.zip -Smoke

      - name: Upload app archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: midnight.server-windows-x64
          path: |
            dist/midnight.server-windows-x64.zip
            dist/SHA256SUMS
