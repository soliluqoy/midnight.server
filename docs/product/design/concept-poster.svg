<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">midnight.server desktop concept</title><desc id="desc">A floating midnight.server mission panel showing visible computer-use progress.</desc>
<defs><radialGradient id="bg" cx="78%" cy="18%"><stop stop-color="#39305f"/><stop offset=".48" stop-color="#17162d"/><stop offset="1" stop-color="#0c1020"/></radialGradient><linearGradient id="panel" x2="0" y2="1"><stop stop-color="#24213f"/><stop offset="1" stop-color="#141326"/></linearGradient><linearGradient id="pink" x2="1"><stop stop-color="#ff9fc7"/><stop offset="1" stop-color="#8068e8"/></linearGradient><filter id="shadow"><feGaussianBlur stdDeviation="24"/></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><g fill="#fff" opacity=".55"><circle cx="110" cy="118" r="2"/><circle cx="280" cy="690" r="2"/><circle cx="1320" cy="120" r="2"/><circle cx="1450" cy="610" r="2"/><circle cx="980" cy="90" r="2"/></g>
<circle cx="1320" cy="215" r="185" fill="#8068e8" opacity=".22" filter="url(#shadow)"/><circle cx="1330" cy="205" r="112" fill="#ffbd84" opacity=".9"/><text x="1266" y="235" fill="#fff3de" font-size="82" font-family="Georgia">◐</text>
<text x="105" y="145" fill="#c5b4ff" font-family="Arial,sans-serif" font-weight="700" font-size="18" letter-spacing="4">PRODUCT CONCEPT · 2027</text><text x="105" y="235" fill="#f5f0ff" font-family="Georgia" font-size="78">The computer</text><text x="105" y="318" fill="#ff9fc7" font-family="Georgia" font-size="78">is finally listening.</text><text x="105" y="370" fill="#b2aecb" font-family="Arial,sans-serif" font-size="22">An always-on, transparent agent for the work between intention and outcome.</text>
<g transform="translate(710 390) rotate(-2)"><rect x="0" y="0" width="680" height="360" rx="24" fill="#050611" opacity=".65" filter="url(#shadow)"/><rect width="680" height="360" rx="18" fill="url(#panel)" stroke="#51466f" stroke-width="2"/><rect width="680" height="48" rx="18" fill="#211d39"/><circle cx="24" cy="24" r="6" fill="#ff899e"/><circle cx="44" cy="24" r="6" fill="#ffc976"/><circle cx="64" cy="24" r="6" fill="#80d9b4"/><text x="250" y="29" fill="#c2b8e1" font-family="monospace" font-size="13">midnight.server · mission</text><rect x="26" y="76" width="34" height="34" rx="11" fill="#8068e8"/><text x="36" y="99" fill="white" font-size="18">✦</text><text x="78" y="90" fill="#f1eafa" font-family="Arial" font-size="16">Find the latest sales sheet, summarize it,</text><text x="78" y="112" fill="#f1eafa" font-family="Arial" font-size="16">make a chart, and draft an email.</text><line x1="44" y1="145" x2="44" y2="294" stroke="#4c426d"/><circle cx="44" cy="157" r="12" fill="#30274b" stroke="#554979"/><text x="39" y="162" fill="#9be8c3" font-size="14">✓</text><text x="72" y="162" fill="#f0eaff" font-family="Arial" font-weight="700" font-size="14">Plan approved</text><text x="280" y="162" fill="#a7a0c1" font-family="monospace" font-size="12">4 steps</text><circle cx="44" cy="207" r="12" fill="#30274b" stroke="#554979"/><text x="39" y="212" fill="#9be8c3" font-size="14">✓</text><text x="72" y="212" fill="#f0eaff" font-family="Arial" font-weight="700" font-size="14">Opened</text><text x="280" y="212" fill="#a7a0c1" font-family="monospace" font-size="12">Q3-sales.xlsx</text><circle cx="44" cy="257" r="12" fill="#30274b" stroke="#554979"/><text x="39" y="262" fill="#ffc976" font-size="14">◌</text><text x="72" y="262" fill="#f0eaff" font-family="Arial" font-weight="700" font-size="14">Analyzing</text><text x="280" y="262" fill="#a7a0c1" font-family="monospace" font-size="12">browser + MCP</text><rect x="26" y="305" width="628" height="34" rx="10" fill="#090c19" stroke="#494064"/><text x="44" y="327" fill="#aaa5c2" font-family="monospace" font-size="12">Ask midnight.server to continue</text><rect x="282" y="316" width="6" height="14" fill="#bba9ff"/></g>
<text x="105" y="795" fill="#aaa5c2" font-family="monospace" font-size="15">midnight.server / ambient computer-use agent</text><rect x="105" y="820" width="210" height="4" rx="2" fill="url(#pink)"/><text x="1340" y="795" fill="#8d87a9" font-family="monospace" font-size="13">WINDOWS · LINUX · macOS</text>
</svg>
